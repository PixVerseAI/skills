name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax and whitespace
        run: |
          bash -n skills/scripts/update.sh skills/scripts/check-update.sh
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Install jq for recipe tests
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
